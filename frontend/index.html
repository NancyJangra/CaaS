<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CaaS — hosted Redis cache with rate limiting and a live developer dashboard." />
    <meta name="theme-color" content="#0F1B4C" />
    <title>CaaS · Developer Infrastructure</title>
    <script>
      // Boot-time theme: apply the stored preference (key: caas_theme) before
      // first paint so there is no light/dark flash. Mirrors utils/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('caas_theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
